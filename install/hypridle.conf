# Written by Tide (Settings → Apps and Hyprland → Idle and lock).

general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session    # lock before suspend.
    after_sleep_cmd = hyprctl dispatch dpms on  # to avoid having to press a key twice to turn on the display.
    ignore_systemd_inhibit = true    # Tide decides (Settings → Idle)
    ignore_wayland_inhibit = true    # Tide decides (Settings → Idle)
}

listener {
    timeout = 120    # dim
    on-timeout = ~/.config/Tide/modes/dev/shell/scripts/idle-step.sh dim
    on-resume = ~/.config/Tide/modes/dev/shell/scripts/idle-step.sh resume
}

listener {
    timeout = 300    # lock
    on-timeout = ~/.config/Tide/modes/dev/shell/scripts/idle-step.sh lock
}
