<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 405" fill="none">
  <!--
    Hit zones (pen_canvas.py _BTN_SVG, SVG coords):
      Barrel button  : x=41 y=207 w=18 h=18
      Rocker ↑       : x=41 y=234 w=18 h=18
      Rocker ↓       : x=41 y=257 w=18 h=20
    Barrel center x=50, button w=18 → x=41 centers on body.
  -->
  <defs>
    <linearGradient id="g-barrel" x1="32" y1="0" x2="68" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#30324a"/>
      <stop offset="22%"  stop-color="#1e2030"/>
      <stop offset="55%"  stop-color="#141620"/>
      <stop offset="100%" stop-color="#0c0d14"/>
    </linearGradient>
    <linearGradient id="g-btn" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#1e202e"/>
      <stop offset="100%" stop-color="#0d0e18"/>
    </linearGradient>
    <linearGradient id="g-collar" x1="30" y1="0" x2="70" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#48506a"/>
      <stop offset="40%"  stop-color="#282a3e"/>
      <stop offset="100%" stop-color="#191a28"/>
    </linearGradient>
    <linearGradient id="g-nib" x1="32" y1="0" x2="68" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#1e2030"/>
      <stop offset="100%" stop-color="#0a0b12"/>
    </linearGradient>
    <filter id="f-sh" x="-35%" y="-2%" width="160%" height="104%">
      <feDropShadow dx="5" dy="1" stdDeviation="7" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- ── BARREL ──────────────────────────────────────────────────────────── -->
  <rect x="32" y="35" width="36" height="265" rx="18"
        fill="url(#g-barrel)" stroke="#252638" stroke-width="1.2" filter="url(#f-sh)"/>
  <line x1="37" y1="56" x2="37" y2="288"
        stroke="#4e5272" stroke-width="1.1" opacity="0.45" stroke-linecap="round"/>

  <!-- ── BARREL BUTTON (w=18 centered: x=41, moved up 15px) ───────────── -->
  <rect x="41" y="207" width="18" height="18" rx="8"
        fill="#08091a" stroke="#3e4262" stroke-width="1.1"/>
  <rect x="43" y="209" width="14" height="14" rx="6"
        fill="url(#g-btn)" stroke="#2e3054" stroke-width="0.75"/>
  <line x1="45" y1="214" x2="55" y2="214"
        stroke="#5a5e80" stroke-width="0.6" opacity="0.42" stroke-linecap="round"/>

  <!-- ── ROCKER ASSEMBLY (moved up 15px) ────────────────────────────────── -->
  <!-- outer housing -->
  <rect x="41" y="232" width="18" height="47" rx="8"
        fill="#06070f" stroke="#3e4262" stroke-width="1.1"/>
  <!-- rocker ↑ face -->
  <rect x="43" y="234" width="14" height="16" rx="5.5"
        fill="url(#g-btn)" stroke="#2e3054" stroke-width="0.75"/>
  <!-- divider -->
  <rect x="41" y="251" width="18" height="3" fill="#03040a"/>
  <!-- rocker ↓ face -->
  <rect x="43" y="255" width="14" height="21" rx="5.5"
        fill="url(#g-btn)" stroke="#2e3054" stroke-width="0.75"/>
  <line x1="45" y1="240" x2="55" y2="240"
        stroke="#5a5e80" stroke-width="0.6" opacity="0.38" stroke-linecap="round"/>
  <line x1="45" y1="263" x2="55" y2="263"
        stroke="#5a5e80" stroke-width="0.6" opacity="0.38" stroke-linecap="round"/>

  <!-- ── COLLAR RING (moved up 5px: 288→283) ───────────────────────────── -->
  <rect x="30" y="283" width="40" height="13" rx="2.5"
        fill="url(#g-collar)" stroke="#3e4262" stroke-width="0.9"/>
  <line x1="33" y1="289" x2="67" y2="289"
        stroke="#6a6e92" stroke-width="0.75" opacity="0.32" stroke-linecap="round"/>

  <!-- ── NIB (moved up 5px) ─────────────────────────────────────────────── -->
  <path d="M 32 296 C 31 311 47 341 50 357 C 53 341 69 311 68 296 Z"
        fill="url(#g-nib)" stroke="#1a1c2e" stroke-width="0.9"/>

  <!-- nib tip -->
  <circle cx="50" cy="358" r="3.2"
          fill="#2e3050" stroke="#404468" stroke-width="0.8" opacity="0.85"/>
</svg>
