<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b2b2d"/>
      <stop offset="100%" stop-color="#141415"/>
    </linearGradient>
    <linearGradient id="strip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#353537"/>
      <stop offset="100%" stop-color="#1a1a1c"/>
    </linearGradient>
    <linearGradient id="button-pill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4c4c50"/>
      <stop offset="100%" stop-color="#232326"/>
    </linearGradient>
    <linearGradient id="dial-edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#57575b"/>
      <stop offset="100%" stop-color="#242427"/>
    </linearGradient>
    <linearGradient id="dial-core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#48484c"/>
      <stop offset="100%" stop-color="#1e1e21"/>
    </linearGradient>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d2a2b"/>
      <stop offset="100%" stop-color="#191717"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#474545"/>
      <stop offset="100%" stop-color="#393737"/>
    </linearGradient>
    <radialGradient id="screen-glow" cx="18%" cy="12%" r="70%">
      <stop offset="0%" stop-color="#5a5858" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <filter id="soft-shadow" x="-25%" y="-25%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="20" y="20" width="820" height="470" rx="28" fill="#000000" opacity="0.12" filter="url(#shadow)"/>

  <rect x="10" y="10" width="840" height="480" rx="26" fill="url(#body)" stroke="#4d4d50" stroke-width="1.6"/>
  <rect x="10" y="10" width="118" height="480" rx="26" fill="url(#strip)"/>
  <rect x="118" y="10" width="2" height="480" fill="#4e4f53" opacity="0.7"/>

  <rect x="38" y="26" width="44" height="12" rx="6" fill="#4b4b4f" stroke="#111114" stroke-width="1"/>
  <rect x="50" y="29.5" width="20" height="5" rx="2.5" fill="#232326"/>
  <circle cx="52" cy="32" r="1.6" fill="#707076"/>

  <g filter="url(#soft-shadow)">
    <circle cx="56" cy="100" r="38" fill="url(#dial-edge)" stroke="#68686d" stroke-width="1.2"/>
    <circle cx="56" cy="100" r="24" fill="none" stroke="#808087" stroke-width="1.2"/>
    <circle cx="56" cy="100" r="13" fill="url(#dial-core)" stroke="#5d5d62" stroke-width="1"/>
  </g>

  <rect x="38" y="152" width="56" height="196" rx="28" fill="url(#button-pill)" stroke="#6e6f74" stroke-width="1.1" filter="url(#soft-shadow)"/>
  <line x1="38" y1="191" x2="94" y2="191" stroke="#58595d" stroke-width="1.2"/>
  <line x1="38" y1="230" x2="94" y2="230" stroke="#58595d" stroke-width="1.2"/>
  <line x1="38" y1="269" x2="94" y2="269" stroke="#58595d" stroke-width="1.2"/>
  <line x1="38" y1="308" x2="94" y2="308" stroke="#58595d" stroke-width="1.2"/>

  <g filter="url(#soft-shadow)">
    <circle cx="56" cy="400" r="38" fill="url(#dial-edge)" stroke="#68686d" stroke-width="1.2"/>
    <circle cx="56" cy="400" r="24" fill="none" stroke="#808087" stroke-width="1.2"/>
    <circle cx="56" cy="400" r="13" fill="url(#dial-core)" stroke="#5d5d62" stroke-width="1"/>
  </g>

  <rect x="118" y="16" width="720" height="468" rx="22" fill="url(#bezel)"/>
  <rect x="175" y="48" width="646" height="378" rx="4" fill="url(#screen)"/>
  <rect x="175" y="48" width="646" height="378" rx="4" fill="url(#screen-glow)"/>

  <rect x="126" y="24" width="704" height="452" rx="18" fill="none" stroke="#3d3a3b" stroke-width="1.4"/>
  <text x="479" y="448" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" letter-spacing="2.4" fill="#6d6d72">HUION</text>
</svg>
