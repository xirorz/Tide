# The update window's look (kitty --config): Tide's panel colors, JetBrains Mono,
# roomy padding, nothing else on screen. Your own kitty.conf isn't used here.
font_family           JetBrains Mono
font_size             12.5
background            #0D0D0F
foreground            #E5E5EA
selection_background  #2C2C30
selection_foreground  #F5F5F7
cursor                #F5F5F7
cursor_shape          beam
cursor_blink_interval 0
window_padding_width  20 24
background_opacity    1
tab_bar_style         hidden
confirm_os_window_close 0
enable_audio_bell     no
scrollback_lines      5000
# muted palette so pacman's colors sit with the rest of the shell
color0  #18181B
color8  #7C7C82
color1  #FF6961
color9  #FF6961
color2  #8FD18F
color10 #8FD18F
color3  #FFB340
color11 #FFD08A
color4  #7AB8F5
color12 #9CCBFA
color5  #D49BEA
color13 #E2B5F2
color6  #6FD3D3
color14 #95E1E1
color7  #C7C7CC
color15 #F5F5F7
